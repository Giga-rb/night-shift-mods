name: build
on:
  push: { branches: [main], paths: ["mods/**", "images/**"] }
  pull_request: { paths: ["mods/**", "images/**"] }
  schedule: [{ cron: "17 */6 * * *" }]   # подхватывает новые релизы модов
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Проверка карточек в PR
        if: github.event_name == 'pull_request'
        run: node scripts/build.mjs --check
      - name: Сборка mods.json
        if: github.event_name != 'pull_request'
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          node scripts/build.mjs
          git config user.name github-actions
          git config user.email actions@github.com
          git add mods.json
          git diff --cached --quiet || (git commit -m "build mods.json [skip ci]" && git push)
